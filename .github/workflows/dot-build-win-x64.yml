name: Build Code OSS for Windows x64
on:
  push:
    branches:
      - dot/build-win-x64-20261119
    paths:
      - .github/workflows/dot-build-win-x64.yml
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      FOUNDRY_LOCAL_SKIP_INSTALL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          architecture: x64
      - uses: ./.github/actions/setup-pnpm
      - name: Ensure MSVC Spectre libraries and Windows SDK
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $components = @(
            'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre',
            'Microsoft.VisualStudio.Component.VC.ATL.Spectre',
            'Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre'
          )
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 installation not found' }
          $ready = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires @components -property installationPath
          if (-not $ready) {
            $adds = ($components | ForEach-Object { "--add $_" }) -join ' '
            $argsLine = "modify --installPath `"$vs`" --quiet --norestart --nocache $adds"
            $p = Start-Process -FilePath (Join-Path $installer 'setup.exe') -ArgumentList $argsLine -Wait -PassThru
            if ($p.ExitCode -notin @(0, 3010)) { throw "Visual Studio setup failed: $($p.ExitCode)" }
            $ready = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires @components -property installationPath
            if (-not $ready) { throw 'Spectre components are not registered after setup' }
          }
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem "$sdk\*\x64\signtool.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'Windows SDK x64 signtool.exe not found' }
          $signtool.DirectoryName >> $env:GITHUB_PATH
          "vs2022_install=$vs" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch built-in extensions
        run: pnpm run download-builtin-extensions
      - name: Build Windows x64
        run: pnpm run gulp vscode-win32-x64-min
      - name: Verify packaged executable and make portable
        id: verify
        shell: pwsh
        run: |
          $dir = (Resolve-Path '..\VSCode-win32-x64').Path
          $exe = Join-Path $dir 'Code - OSS.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable missing: $exe" }
          $version = & (Join-Path $dir 'bin\code-oss.cmd') --version
          if ($LASTEXITCODE -ne 0 -or $version -notcontains 'x64') { throw "Packaged CLI failed version check: $version" }
          $version | Write-Host
          $data = New-Item -ItemType Directory -Path (Join-Path $dir 'data') -Force
          'Portable data stays in this directory.' | Set-Content (Join-Path $data.FullName 'README.txt')
          "path=$dir" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Code-OSS-window-routing-win32-x64-portable
          path: ${{ steps.verify.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  release:
    needs: windows-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download and publish verified portable package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE: cae5715d7317440355591ad2b2fe1c5e326b0f81
          TAG: v1.148.0-window-routing.1
          ASSET: Code-OSS-1.148.0-window-routing-win32-x64-portable.zip
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$REPO" -n Code-OSS-window-routing-win32-x64-portable -D portable
          test -s 'portable/Code - OSS.exe'
          test -f 'portable/data/README.txt'
          (cd portable && zip -qr "../$ASSET" .)
          unzip -tq "$ASSET"
          sha256sum "$ASSET" > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          Windows x64 portable build of the Code - OSS Window Routing Fork. Extract the ZIP and open `Code - OSS.exe`. The `data` folder keeps settings and extensions with the app.
          
          - Move supported file tabs between windows and route file opens by extension.
          - This fork build is not Microsoft-signed. The build pipeline verifies the packaged CLI with `--version`; GUI behavior was not tested in CI.
          - `SHA256SUMS.txt` lists the SHA-256 checksum of the ZIP.
          EOF
          printf '\nSource: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$SOURCE" "$REPO" "$RUN_ID" >> release-notes.md
          gh release create "$TAG" -R "$REPO" --target "$SOURCE" --title 'Code - OSS Window Routing 1.148.0 · Windows x64' --notes-file release-notes.md --draft "$ASSET" SHA256SUMS.txt
          gh release edit "$TAG" -R "$REPO" --draft=false
          gh release view "$TAG" -R "$REPO" --json url,isDraft,assets
